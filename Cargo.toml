[package]
name = "credential-audit-mesh"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Enterprise credential, authorization and audit mesh for B2B networks"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
